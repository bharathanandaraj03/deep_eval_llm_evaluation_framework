name: Enterprise LLM Regression Test
on:
  push:
    branches: [main,master]
  pull_request: 
    branches: [main,master]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: 
            python-version: "3.10"
      - run: pip install -r requirements.txt
      - name: Unit tests (no LLM calls)
        run: pytest tests/chatbot/unit -q
  evaluate:
    needs: unit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - name: Agent evals
        run: deepeval test run tests/test_agent.py
      - name: Chatbot evals
        run: deepeval test run tests/chatbot/eval -n 4
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/eval_report.html